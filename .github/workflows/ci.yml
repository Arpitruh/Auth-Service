name: Auth Service CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auth_ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/auth_ci?schema=public
      RUN_DB_TESTS: '1'
      RUN_REDIS_TESTS: '1'
      REDIS_TEST_URL: redis://127.0.0.1:6379
      CONTROL_PLANE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/auth_control_ci
      RUN_CONTROL_TESTS: '1'
      RUN_TENANT_TESTS: '1'
      TENANT_JWT_SECRET: ci-only-tenant-secret-with-strong-test-length-12345
      OIDC_ISSUER: http://localhost:5000
      OIDC_KEY_ID: ci-testing-rsa-key
      CONTROL_PLANE_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      JWT_ACCESS_SECRET: ci-only-not-a-production-access-secret-string
      JWT_REFRESH_SECRET: ci-only-not-a-production-refresh-secret-string
      INTROSPECTION_API_KEYS: ci-only-introspection-key-not-for-use-outside-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Create isolated control database
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE auth_control_ci'
      - run: npm run control:migrate
      - name: Create two isolated tenant databases
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE tenant_alpha_ci'
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE tenant_beta_ci'
      - name: Apply Auth schema to each tenant independently
        run: |
          DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/tenant_alpha_ci?sslmode=disable' npx prisma migrate deploy
          DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/tenant_beta_ci?sslmode=disable' npx prisma migrate deploy
      - name: Verify repeat control migration is idempotent
        run: npm run control:migrate
      - name: Generate disposable RSA key for OIDC tests
        run: |
          node --input-type=module -e "import {generateKeyPairSync} from 'node:crypto'; import {appendFileSync} from 'node:fs'; const {privateKey}=generateKeyPairSync('rsa',{modulusLength:2048}); const pem=privateKey.export({type:'pkcs8',format:'pem'}); appendFileSync(process.env.GITHUB_ENV,'OIDC_PRIVATE_KEY_B64='+Buffer.from(pem).toString('base64')+'\\n');"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
