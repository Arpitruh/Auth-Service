name: Auth Service CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/auth_ci
      JWT_ACCESS_SECRET: ci-only-not-a-production-access-secret-string
      JWT_REFRESH_SECRET: ci-only-not-a-production-refresh-secret-string
      INTROSPECTION_API_KEYS: ci-only-introspection-key-not-for-use-outside-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
